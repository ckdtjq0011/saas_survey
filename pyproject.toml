[project]
name = "saas-survey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.119.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pytest-cov>=7.0.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "typer>=0.20.0",
    "uvicorn>=0.37.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "dependency-injector>=4.41.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.3.0",
    "apscheduler>=3.10.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
